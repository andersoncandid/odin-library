<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
    <title>Library App</title>
  </head>
  <body>
    <header>
      <h1>Odin Library</h1>
      <button id="new-book">New Book</button>
      <dialog class="dialog modal">
        <form>
          <p>Add a New Book</p>
          <p>
            <label for="title">Title:</label>
            <input type="text" id="title" name="book_title" />
          </p>

          <p>
            <label for="author">Author:</label>
            <input type="text" id="author" name="book_author" />
          </p>

          <p>
            <label for="pages">Total pages:</label>
            <input type="number" id="pages" name="book_pages" />
          </p>
          <div>
            <button value="cancel" formmethod="dialog">Cancel</button>
            <button id="confirmBtn" value="default">Confirm</button>
          </div>
        </form>
      </dialog>
    </header>
    <section class="books">
      <p class="books-header">Your Books</p>
      <div class="books-container"></div>
    </section>
  </body>
</html>
