<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
    <title>Library App</title>
  </head>
  <body>
    <header>
      <h1>Odin Library</h1>
      <button id="new-book-btn">New Book</button>
      <dialog class="dialog" closedby="none">
        <form>
          <div class="form-header">
            <img src="/img/book.png" alt="Book Image" />
            <p>Add a New Book</p>
          </div>

          <div class="form-content">
            <p>
              <label for="title">Book Title</label>
              <input type="text" id="title" name="book_title" />
              <span class="feedback">Title is required</span>
            </p>

            <p>
              <label for="author">Author</label>
              <input type="text" id="author" name="book_author" />
            </p>

            <p>
              <label for="pages">Number of pages</label>
              <input
                type="number"
                id="pages"
                name="book_pages"
                placeholder="Ex: 300"
              />
            </p>
            <p>
              <label for="comments">Additional comments</label>
              <textarea
                id="comments"
                name="book_comments"
                placeholder="Type here..."
              ></textarea>
            </p>
          </div>
          <div class="dialog-buttons">
            <button id="close-btn" formmethod="dialog">Close ✘</button>
            <button id="confirm-btn" type="submit">Confirm ✔</button>
          </div>
        </form>
      </dialog>
    </header>
